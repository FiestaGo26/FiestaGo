# Configuración de build de Netlify para FiestaGo (Next.js 14, App Router)
# El runtime de Next.js de Netlify se encarga de las rutas dinámicas, API y SSR.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Evita que un warning de auditoría/peer-deps tumbe el build.
  NPM_FLAGS = "--no-audit --no-fund"
